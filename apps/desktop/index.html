<!doctype html>
<!--
  `lang` and `dir` are placeholders. `main.tsx` sets both from the stored
  locale before React renders, so the first paint is already mirrored for a
  right-to-left language rather than snapping into place afterwards.
-->
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Integr8 Plus</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
