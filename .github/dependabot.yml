version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # One PR per concern keeps review cheap and rollback precise.
      dev-tooling:
        patterns:
          - '@commitlint/*'
          - 'eslint*'
          - '@eslint/*'
          - 'typescript-eslint'
          - 'prettier'
          - 'husky'
          - 'lint-staged'
          - 'turbo'
          - 'vitest'
      types:
        patterns:
          - '@types/*'
      # The phone's native packages move together within one Expo SDK.
      expo:
        patterns:
          - 'expo'
          - 'expo-*'
          - '@expo/*'
          - 'react-native'
          - 'react-native-*'
          - '@react-native-community/*'
          - '@sentry/react-native'
    ignore:
      # A new Expo SDK changes every native package and React Native at once;
      # one package's major on its own builds an app that does not run. SDK
      # upgrades are done deliberately, all packages together, to the versions
      # in the SDK's bundledNativeModules.json.
      - dependency-name: 'expo'
        update-types: ['version-update:semver-major']
      - dependency-name: 'expo-*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@expo/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-native'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: 'react-native-*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(ci)'
