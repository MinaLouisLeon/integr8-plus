version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # One PR per concern keeps review cheap and rollback precise.
      dev-tooling:
        patterns:
          - '@commitlint/*'
          - 'eslint*'
          - '@eslint/*'
          - 'typescript-eslint'
          - 'prettier'
          - 'husky'
          - 'lint-staged'
          - 'turbo'
          - 'vitest'
      types:
        patterns:
          - '@types/*'
      # The phone's native packages move together within one Expo SDK.
      expo:
        patterns:
          - 'expo'
          - 'expo-*'
          - '@expo/*'
          - 'react-native'
          - 'react-native-*'
          - '@react-native-community/*'
          - '@sentry/react-native'
    ignore:
      # A new Expo SDK changes every native package and React Native at once;
      # one package's major on its own builds an app that does not run. SDK
      # upgrades are done deliberately, all packages together, to the versions
      # in the SDK's bundledNativeModules.json.
      - dependency-name: 'expo'
        update-types: ['version-update:semver-major']
      - dependency-name: 'expo-*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@expo/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-native'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: 'react-native-*'
        update-types: ['version-update:semver-major']
      # `tauri build` refuses to run when @tauri-apps/api and the Rust `tauri`
      # crate (apps/desktop/src-tauri/Cargo.lock) differ in major or minor, and
      # Dependabot does not update the Cargo side. Tauri minors are moved by
      # hand, npm and Cargo together; patches still come through here.
      - dependency-name: '@tauri-apps/*'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(ci)'

  # The images in deploy/compose.yml (P36): Supabase Auth above all, which is
  # pinned and must not be left to age. A Postgres major needs a dump and
  # restore, so only its minors come through here.
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      - dependency-name: 'postgres'
        update-types: ['version-update:semver-major']

  # The Node base image of the API/worker and web images. Its tag is the exact
  # release in .nvmrc (`pnpm pins:check` fails otherwise), so a proposed bump
  # fails CI until the same PR moves .nvmrc too; that keeps CI, developers and
  # the server on one Node. Node 22 is the line this release supports
  # (package.json engines `<23`): a new major is moved by hand, everywhere.
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
