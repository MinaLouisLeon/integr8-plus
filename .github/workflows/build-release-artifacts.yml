# Everything a release is made of, built once and the same way for both
# channels.
#
# Nightly (staging) and versioned (main) call this with different inputs and
# nothing else. That is the point of a staging channel: if the nightly and the
# release were built by two different workflows, a green nightly would say
# nothing useful about the release.
#
# What this does not do is deploy. The API and the web app are built here and
# attached as build output; turning that into something a server runs is P19
# and P20, and calling a tarball a deployment before then would be a promise
# this repository cannot keep.
name: Build release artifacts

on:
  workflow_call:
    inputs:
      version:
        description: Full version, e.g. 0.1.0 or 0.1.0-nightly.20260910.gabc1234
        type: string
        required: true
      base-version:
        description: The plain X.Y.Z part. Installers use this; MSI rejects prerelease suffixes.
        type: string
        required: true
      channel:
        description: nightly | release
        type: string
        required: true
      desktop-platforms:
        description: JSON array of runner labels for the Tauri matrix.
        type: string
        required: true
      eas-profile:
        description: The eas.json build profile to use, when EAS builds are enabled.
        type: string
        required: true
      api-url:
        description: >
          The API the desktop installer talks to, e.g. https://api.example.com. Vite inlines
          it at build time, so there is one installer per API hostname; the nightly points at
          the staging API and the release at production's. Empty refuses the desktop build
          rather than shipping an installer that talks to localhost.
        type: string
        required: true
      app-env:
        description: staging | production, inlined as VITE_APP_ENV.
        type: string
        required: true
      desktop-sentry-dsn:
        description: The desktop app's Sentry DSN. Optional; empty means errors are not reported.
        type: string
        required: false
        default: ''

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  # ---------------------------------------------------------------------------
  # The two things that deploy rather than install
  # ---------------------------------------------------------------------------
  server:
    name: API and web build output
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Generate the OpenAPI spec
        run: pnpm --filter @integr8/api openapi

      - name: Package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts

          # The build output, not a deployment. Anything that runs this needs
          # production dependencies installed alongside it.
          tar -czf "artifacts/integr8-api-${VERSION}.tar.gz" \
            -C apps/api dist package.json openapi.json

          # `public` exists only once the web app has static files to serve;
          # tar refuses a missing member, so it is listed only when present.
          web_members=(.next package.json next.config.ts)
          if [ -d apps/web/public ]; then web_members+=(public); fi
          tar -czf "artifacts/integr8-web-${VERSION}.tar.gz" \
            -C apps/web "${web_members[@]}"

          cp apps/api/openapi.json "artifacts/openapi-${VERSION}.json"
          ls -la artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: server-${{ inputs.version }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # The one people actually install
  # ---------------------------------------------------------------------------
  desktop:
    name: Desktop installer (${{ matrix.platform }})
    if: vars.DESKTOP_BUILDS != 'disabled'
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.desktop-platforms) }}
    # Which signing this deployment has, as 'true' or 'false': a step cannot test
    # a secret directly. Every one is optional; without it the build is what it
    # always was (setup guide, Stage 6, "Code signing"). TAURI_SIGNING_PRIVATE_KEY signs
    # updates, which the app checks against the public key it carries; the
    # others are the operating systems' own code signing, which only changes
    # what Windows and macOS say when the installer is first opened.
    env:
      SIGN_UPDATES: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      SIGN_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
      SIGN_WINDOWS_AZURE: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_CLIENT_SECRET != '' && secrets.AZURE_TENANT_ID != '' && vars.AZURE_SIGNING_ENDPOINT != '' && vars.AZURE_SIGNING_ACCOUNT != '' && vars.AZURE_SIGNING_PROFILE != '' }}
      SIGN_MACOS: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.platform }}

      # Tauri links against the system webview. Everywhere but Linux that ships
      # with the operating system.
      - name: Install Linux webview dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            file

      # An installer is built for exactly one API, baked in. Without an address
      # the app falls back to http://localhost:3000, which is right for a
      # developer's laptop and wrong for every installer a customer runs.
      - name: Refuse an installer that would point at localhost
        shell: bash
        env:
          API_URL: ${{ inputs.api-url }}
        run: |
          set -euo pipefail
          if [ -z "$API_URL" ]; then
            echo "::error::No API address for the desktop installer. Set the PUBLIC_API_URL repository variable (STAGING_PUBLIC_API_URL for the nightly) to the API's https address."
            exit 1
          fi
          case "$API_URL" in
            https://*) echo "Installer will talk to $API_URL" ;;
            *) echo "::error::The desktop API address must start with https:// (got $API_URL)."; exit 1 ;;
          esac

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Windows code signing with a certificate file (a code-signing
      # certificate exported as .pfx, base64 in WINDOWS_CERTIFICATE), imported
      # into this runner's own store so Tauri can sign with it by thumbprint.
      - name: Import the Windows code-signing certificate
        id: windows-certificate
        if: runner.os == 'Windows' && env.SIGN_WINDOWS_CERTIFICATE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'certificate.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $certificate = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $path
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT

      # Or Azure Artifact Signing (formerly Trusted Signing): no certificate
      # file at all; Tauri runs this command on each file it signs.
      - name: Install the Azure Artifact Signing client
        if: runner.os == 'Windows' && env.SIGN_WINDOWS_CERTIFICATE != 'true' && env.SIGN_WINDOWS_AZURE == 'true'
        shell: bash
        run: cargo install artifact-signing-cli --version 0.11.0 --locked

      # macOS signing and notarisation with a Developer ID Application
      # certificate. Written to the environment only when present: Tauri
      # treats an empty APPLE_SIGNING_IDENTITY as an identity to sign with.
      # Notarisation uses the App Store Connect API key the phone apps already
      # submit with, or else an Apple ID with an app-specific password.
      - name: Prepare macOS signing and notarisation
        if: runner.os == 'macOS' && env.SIGN_MACOS == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          put() { local end="END_$RANDOM$RANDOM"; { echo "$1<<$end"; printf '%s\n' "$2"; echo "$end"; } >> "$GITHUB_ENV"; }
          put APPLE_CERTIFICATE "$APPLE_CERTIFICATE"
          put APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
          put APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"
          if [ -n "$ASC_API_KEY" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ]; then
            key="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
            printf '%s' "$ASC_API_KEY" > "$key"
            put APPLE_API_ISSUER "$ASC_ISSUER_ID"
            put APPLE_API_KEY "$ASC_KEY_ID"
            put APPLE_API_KEY_PATH "$key"
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            put APPLE_ID "$APPLE_ID"
            put APPLE_PASSWORD "$APPLE_PASSWORD"
            put APPLE_TEAM_ID "$APPLE_TEAM_ID"
          else
            echo "::warning::The macOS app is signed but not notarised: set ASC_API_KEY, ASC_KEY_ID and ASC_ISSUER_ID (or APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID). macOS still warns on first open."
          fi

      # The root package.json version is the product version. Writing it into
      # tauri.conf.json here rather than keeping two numbers in step by hand is
      # the difference between a release and a release that claims to be an
      # older one.
      #
      # The plain X.Y.Z, not the full version: Windows MSI product versions are
      # three numbers and reject a prerelease suffix outright. Which nightly an
      # installer came from is recorded by the release it is attached to. Giving
      # the updater a way to tell nightlies apart is P20.
      #
      # The same step points the window's content-security policy at the API.
      # The policy in tauri.conf.json names a placeholder host; an installer
      # built without this would be forbidden from calling the real API and
      # every sign-in would fail inside the window before a request left it.
      # The staff flavour (0022): the one installer Integr8's own people use.
      # It carries its own name and identifier and shows only the staff
      # sign-in; a company's people get a build of their own from
      # build-company-apps.yml, stamped with that company's brand. The script
      # also writes the version (plain X.Y.Z: Windows MSI rejects a prerelease
      # suffix) and points the window's content-security policy at the API,
      # without which every sign-in would fail inside the window.
      #
      # A versioned release also gets its updater feed, the web app's
      # /desktop-updates/staff/…, which offers the newest `v*` release's
      # latest.json, and the signed update bundles the feed points at. A
      # nightly keeps the placeholder feed: it talks to the staging API and
      # must never update itself into a production release.
      - name: Stamp the staff flavour, the version and the API origin into the bundle
        shell: bash
        env:
          BASE_VERSION: ${{ inputs.base-version }}
          API_URL: ${{ inputs.api-url }}
          CHANNEL: ${{ inputs.channel }}
          UPDATER_BASE: ${{ vars.DESKTOP_UPDATES_URL || 'https://app.integr8-media.com/desktop-updates' }}
          THUMBPRINT: ${{ steps.windows-certificate.outputs.thumbprint }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          set -euo pipefail
          flags=(--version "$BASE_VERSION" --api-url "$API_URL" --flavor staff)
          if [ "$CHANNEL" = release ]; then
            flags+=(--updater-base "$UPDATER_BASE")
            if [ "$SIGN_UPDATES" = true ]; then
              flags+=(--updater-artifacts)
            else
              echo "::warning::No TAURI_SIGNING_PRIVATE_KEY secret: this release cannot be offered to installed apps as an update."
            fi
          fi
          if [ -n "$THUMBPRINT" ]; then
            flags+=(--windows-certificate-thumbprint "$THUMBPRINT")
          elif [ "$RUNNER_OS" = Windows ] && [ "$SIGN_WINDOWS_AZURE" = true ]; then
            flags+=(--windows-sign-command "artifact-signing-cli -e $AZURE_SIGNING_ENDPOINT -a $AZURE_SIGNING_ACCOUNT -c $AZURE_SIGNING_PROFILE %1")
          elif [ "$RUNNER_OS" = Windows ]; then
            echo "::notice::No Windows code-signing secrets: the installer is unsigned and SmartScreen warns when it is first opened."
          fi
          node apps/desktop/scripts/stamp.mjs "${flags[@]}"

      - name: Build the workspace packages the app imports
        run: pnpm build

      # Vite reads VITE_* from the environment at build time and inlines them;
      # apps/desktop/.env.example lists them. None may be a secret.
      - name: Build the installer
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          VITE_API_BASE_URL: ${{ inputs.api-url }}
          VITE_APP_ENV: ${{ inputs.app-env }}
          VITE_APP_VERSION: ${{ inputs.version }}
          VITE_APP_FLAVOR: staff
          VITE_SENTRY_DSN: ${{ inputs.desktop-sentry-dsn }}
          # Absent on a fork or before the key is stored: the build still runs
          # and produces an installer, it just carries no update signature (the
          # stamp step asks for update bundles only when the key exists).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Read by artifact-signing-cli, which runs only when the stamp step gave
          # Tauri its sign command; empty otherwise, and then unused.
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        with:
          projectPath: apps/desktop

      # Tauri lists everything it bundled. The script keeps the regular files
      # (on macOS the bare `.app` folder sits beside the `.dmg`), names them so
      # GitHub stores them as they are, and writes this platform's part of the
      # updater manifest, which the release job merges into latest.json.
      - name: Collect the installers
        shell: bash
        env:
          PATHS: ${{ steps.tauri.outputs.artifactPaths }}
          BASE_VERSION: ${{ inputs.base-version }}
        run: |
          set -euo pipefail
          node apps/desktop/scripts/collect-bundles.mjs \
            --paths "$PATHS" --out collected --prefix integr8-plus-staff --version "$BASE_VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ inputs.version }}
          path: collected/*
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Mobile, when there is an Expo account behind it
  # ---------------------------------------------------------------------------
  mobile:
    name: Mobile build (EAS, generic, nightly only)
    # Gated on a repository variable rather than on the secret, because a job
    # cannot branch on whether a secret exists. Local development needs none of it.
    #
    # Nightly only. The phone app a customer installs is built once per company
    # with that company baked in (build-company-apps.yml, run from the version
    # release); this generic build, with no company, is for Integr8's own
    # testers against the staging API and would be the wrong thing to hand to
    # a customer.
    if: vars.EAS_BUILDS == 'enabled' && inputs.channel == 'nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # --no-wait: the binaries are built and kept by EAS, not by this run. The
      # release notes link to them rather than attaching them.
      #
      # Android only until there are iOS credentials: an iOS build needs an
      # Apple developer account connected to Expo, and in non-interactive mode
      # EAS fails the whole command when it cannot find them, which took the
      # release down with it. Set the EAS_PLATFORMS repository variable to
      # `all` once the Apple side exists.
      - name: Queue the build
        working-directory: apps/mobile
        env:
          EAS_PLATFORMS: ${{ vars.EAS_PLATFORMS || 'android' }}
        run: eas build --platform "$EAS_PLATFORMS" --profile ${{ inputs.eas-profile }} --non-interactive --no-wait
