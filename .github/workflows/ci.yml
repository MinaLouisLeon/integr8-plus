name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  commit-messages:
    name: Conventional commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate commit messages in this PR
        run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  database:
    name: Migrations, tenant isolation and authentication
    # Gated on a repository variable rather than on the secret, because a job
    # cannot branch on a secret's presence. Setting DATABASE_TESTS=enabled is
    # step 8 of docs/database/runbook-supabase-setup.md, and until it is set the
    # P02 exit criterion "the isolation suite runs in CI" is not met.
    if: vars.DATABASE_TESTS == 'enabled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build

      # Rolls the schema all the way down and back up before the suites run, so
      # every `down` file is exercised on every pull request rather than being
      # written once and never executed.
      - name: Migrate, isolate, verify
        run: pnpm --filter @integr8/db test:integration
        env:
          APP_ENV: test
          INTEGR8_TEST_DATABASE: i-know-this-database-is-disposable
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          DATABASE_URL_ADMIN: ${{ secrets.TEST_DATABASE_URL_ADMIN }}
          DATABASE_URL_AUTH: ${{ secrets.TEST_DATABASE_URL_AUTH }}

      # Runs after the database suite, which has just rolled the schema down and
      # back up. Keys are generated per run rather than stored: nothing here
      # needs to verify a token minted by a previous run.
      - name: Generate signing keys for this run
        id: keys
        run: pnpm --filter @integr8/auth keygen >> "$GITHUB_ENV"

      - name: Sessions, invitations and impersonation
        run: pnpm --filter @integr8/auth test:integration
        env:
          APP_ENV: test
          INTEGR8_TEST_DATABASE: i-know-this-database-is-disposable
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          DATABASE_URL_ADMIN: ${{ secrets.TEST_DATABASE_URL_ADMIN }}
          DATABASE_URL_AUTH: ${{ secrets.TEST_DATABASE_URL_AUTH }}
          AUTH_ISSUER: https://api.ci.integr8.example

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
