name: CI

# Pull requests only. The push side of main, staging and dev belongs to the
# three branch workflows, which run the same verification through verify.yml
# before deciding whether to release. Leaving the push trigger here as well
# would run the whole suite twice on every merge and say nothing new the second
# time.
on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      # Permissive licences only; anything else is named, with its reason, in
      # scripts/licences/exceptions.json (ADR-0012).
      - name: Dependency licences
        run: pnpm licences:check

      # Exact dependency versions, and one Node release in .nvmrc, the
      # Dockerfiles and package.json engines (scripts/pins/check.mjs).
      - name: Exact versions
        run: pnpm pins:check

      # The setup guide is kept as Markdown and as HTML, CSS and JavaScript;
      # they must say the same thing (AGENTS.md, "The setup guide").
      - name: Setup guide copies agree
        run: pnpm guide:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The published contract is generated from the route registry and
      # committed, so a spec change is a diff in review. This fails if the two
      # have drifted — which is the only way three generated clients can quietly
      # stop matching the server.
      - name: OpenAPI spec is up to date
        run: |
          pnpm --filter @integr8/api openapi
          pnpm --filter @integr8/api-client generate
          if ! git diff --exit-code -- apps/api/openapi.json packages/api-client/src/generated; then
            echo "::error::The OpenAPI spec or the generated client is out of date."
            echo "Run: pnpm --filter @integr8/api openapi && pnpm --filter @integr8/api-client generate"
            exit 1
          fi

      # The contract, downloadable from the run that produced it. A partner
      # integrating against a specific release should not have to guess which
      # commit it came from.
      - name: Publish the OpenAPI spec
        uses: actions/upload-artifact@v7
        with:
          name: openapi-${{ github.sha }}
          path: apps/api/openapi.json
          if-no-files-found: error

  commit-messages:
    name: Conventional commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate commit messages in this PR
        # Commits already on main are released history and can no longer be
        # reworded, so they are left out: main merged back into dev (to bring
        # in a fix made there) must not fail every pull request after it.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --quiet origin main
          status=0
          for sha in $(git rev-list --reverse "$HEAD_SHA" "^$BASE_SHA" ^FETCH_HEAD); do
            git log -1 --format=%B "$sha" | pnpm exec commitlint --verbose || status=1
          done
          exit "$status"

  form-engine-hermes:
    name: Form engine agrees in Hermes
    # P06's first exit criterion: the same definition and answers produce
    # byte-identical results in Node and in a React Native runtime. The unit
    # tests produce the golden file in Node; this runs the same corpus inside a
    # second JavaScript engine and compares every byte.
    #
    # The Hermes command-line runner is pinned by checksum. It is the newest
    # prebuilt one Facebook publishes (the v0.13.0 release, whose binary reports
    # itself as 0.12.0); the phone runs Hermes V1 inside React Native 0.88.
    # docs/form-engine/README.md says exactly what that does and does not prove.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      HERMES_RELEASE: v0.13.0
      HERMES_SHA256: aead6eb0b8f563bb022354352eae32dad96c933330b6c1941b6db17674ca68ae
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the Hermes command-line runner
        run: |
          set -euo pipefail
          curl -fsSL -o hermes.tar.gz             "https://github.com/facebook/hermes/releases/download/${HERMES_RELEASE}/hermes-cli-linux.tar.gz"
          echo "${HERMES_SHA256}  hermes.tar.gz" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/hermes"
          tar -xzf hermes.tar.gz -C "${RUNNER_TEMP}/hermes"
          echo "HERMES_BIN=${RUNNER_TEMP}/hermes/hermes" >> "${GITHUB_ENV}"

      - name: Build workspace packages
        run: pnpm build

      - name: Run the conformance corpus in Hermes
        run: pnpm --filter @integr8/form-engine conformance:hermes

  database:
    name: Migrations, isolation, authentication and API
    # Runs on every pull request against a throwaway Postgres in a service
    # container, with no account anywhere. Until this job existed the isolation
    # suite — the most consequential code in the repository — had only ever run
    # on a laptop, because the previous version was gated on a Supabase project
    # nobody had wired in. Production is the same shape as this job: a plain
    # Postgres and a self-hosted Supabase Auth container (P36).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: integr8_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      INTEGR8_TEST_DATABASE: i-know-this-database-is-disposable
      # Throwaway credentials for a database that is deleted with the runner.
      INTEGR8_APP_PASSWORD: ci-app-password
      INTEGR8_AUTH_PASSWORD: ci-auth-password
      # The API and worker's cross-company role (0058). Set for every suite, so
      # the platform paths run as the limited role, as they do on the server.
      INTEGR8_PLATFORM_PASSWORD: ci-platform-password
      # Supabase Auth's own role and schema, created by bootstrap (P36).
      SUPABASE_AUTH_DB_PASSWORD: ci-supabase-auth-password
      DATABASE_URL_ADMIN: postgres://postgres:postgres@localhost:5432/integr8_test
      DATABASE_URL: postgres://integr8_app:ci-app-password@localhost:5432/integr8_test
      DATABASE_URL_AUTH: postgres://integr8_auth:ci-auth-password@localhost:5432/integr8_test
      DATABASE_URL_PLATFORM: postgres://integr8_platform:ci-platform-password@localhost:5432/integr8_test
      AUTH_ISSUER: https://api.ci.integr8.example
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build

      # The same command deploy/compose.yml runs, so what the suites prove
      # about the roles holds on the server.
      - name: Create the runtime, auth, platform and Supabase Auth roles
        run: pnpm --filter @integr8/db db bootstrap

      # Rolls the schema all the way down and back up before the suites run, so
      # every `down` file is exercised on every pull request rather than being
      # written once and never executed.
      - name: Migrate, isolate, verify
        run: pnpm --filter @integr8/db test:integration

      # Runs after the database suite, which has just rolled the schema down and
      # back up. Keys are generated per run rather than stored: nothing here
      # needs to verify a token minted by a previous run.
      - name: Generate signing keys for this run
        # Only the KEY=VALUE lines: pnpm's own banner and keygen's explanatory
        # comments are not environment variables, and GITHUB_ENV refuses them.
        # The Auth database password is left out: bootstrap has already set the
        # role's password from the job's own value.
        run: >-
          pnpm --silent --filter @integr8/auth keygen | grep -E '^[A-Z_]+=' |
          grep -v '^SUPABASE_AUTH_DB_PASSWORD=' >> "$GITHUB_ENV"

      - name: Sessions, invitations, impersonation, sign-in codes and passwords
        run: pnpm --filter @integr8/auth test:integration

      # The real Auth container, configured as deploy/compose.yml configures
      # it. Not a service container: it needs the role bootstrap creates, and a
      # service starts before any step runs. It migrates its own `auth` schema
      # in the test database at start-up.
      - name: Start Supabase Auth
        run: |
          docker run -d --name supabase-auth --network host \
            -e GOTRUE_API_HOST=127.0.0.1 -e GOTRUE_API_PORT=9999 -e PORT=9999 \
            -e API_EXTERNAL_URL=http://localhost:9999 \
            -e GOTRUE_DB_DRIVER=postgres \
            -e GOTRUE_DB_DATABASE_URL="postgres://supabase_auth_admin:${SUPABASE_AUTH_DB_PASSWORD}@localhost:5432/integr8_test" \
            -e DB_NAMESPACE=auth \
            -e GOTRUE_SITE_URL=http://localhost:3001 \
            -e GOTRUE_JWT_SECRET="${SUPABASE_AUTH_JWT_SECRET}" \
            -e GOTRUE_JWT_ADMIN_ROLES=service_role \
            -e GOTRUE_DISABLE_SIGNUP=true \
            -e GOTRUE_EXTERNAL_EMAIL_ENABLED=true \
            -e GOTRUE_EXTERNAL_PHONE_ENABLED=false \
            -e GOTRUE_MAILER_OTP_EXP=900 \
            -e GOTRUE_MAILER_OTP_LENGTH=6 \
            supabase/auth:v2.197.0
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:9999/health > /dev/null; then exit 0; fi
            sleep 2
          done
          docker logs supabase-auth
          exit 1

      - name: The identity provider against the real Auth
        env:
          SUPABASE_AUTH_URL: http://localhost:9999
        run: pnpm --filter @integr8/auth test:auth-server

      - name: Auth container log
        if: failure()
        run: docker logs supabase-auth || true

      # Real HTTP through the assembled server: idempotent replay, the
      # outdated-client response, the request id on every log line, and the
      # phone's own sync engine against the real server.
      #
      # The R2 media suite (media-r2.integration.test.ts) runs against real
      # Cloudflare R2 only when these repository secrets exist, and skips itself
      # otherwise. Use a separate Cloudflare account for them: the suite needs
      # an account-level R2 token, which can delete any bucket in its account.
      - name: API contract, request pipeline and sync
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_TEST_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_TEST_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_TEST_SECRET_ACCESS_KEY }}
        run: pnpm --filter @integr8/api test:integration

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # On a pull request gitleaks-action asks the API for the PR's commits before
    # it scans anything. Without `pull-requests: read` that call fails with
    # "Resource not accessible by integration", the action crashes, and the job
    # goes red having scanned nothing — which it did on every pull request until
    # this was added. A red secret scan that is always red is not a secret scan.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
