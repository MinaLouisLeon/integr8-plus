# The verification every build shares, in one place.
#
# Called by the three branch builds rather than copied into them, because three
# copies of a build is three chances for the release build to be checking
# something the test build is not.
#
# Nothing here publishes anything. What each branch does with a green run is the
# calling workflow's business.
name: Verify

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to verify. Defaults to the caller's commit.
        type: string
        required: false
        default: ""

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The published contract is generated from the route registry and
      # committed, so a spec change is a diff in review. This fails when the two
      # have drifted, which is the only way three generated clients quietly stop
      # matching the server.
      - name: OpenAPI spec is up to date
        run: |
          pnpm --filter @integr8/api openapi
          pnpm --filter @integr8/api-client generate
          if ! git diff --exit-code -- apps/api/openapi.json packages/api-client/src/generated; then
            echo "::error::The OpenAPI spec or the generated client is out of date."
            echo "Run: pnpm --filter @integr8/api openapi && pnpm --filter @integr8/api-client generate"
            exit 1
          fi
